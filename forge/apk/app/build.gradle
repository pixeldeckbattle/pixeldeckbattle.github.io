plugins { id 'com.android.application' }

def ksPath = System.getenv('KS_PATH')

android {
    namespace 'com.pixeldeck.forge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pixeldeck.forge'
        minSdk 29
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KS_PASS')
                keyAlias 'forge'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'ttf' }
}
