<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PixelDeck Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
@font-face{font-family:'Silkscreen';src:url(silkscreen.ttf) format('truetype');font-display:swap}
@font-face{font-family:"PDNum";src:url(game/fnt/num-Bold.woff) format("woff");font-weight:600 900;unicode-range:U+30-39,U+25,U+2B,U+2C,U+2E}
@font-face{font-family:"PDNum";src:url(game/fnt/num-SemiBold.woff) format("woff");font-weight:100 500;unicode-range:U+30-39,U+25,U+2B,U+2C,U+2E}
/* Layout: an engine-style editor — top bar, tool rail, canvas in the middle, a tabbed side panel (bottom sheet on narrow screens) */
:root{
  --bg:#0f1016;--bg2:#15161f;--panel:#1b1c27;--panel2:#232433;--panel3:#2c2d40;--line:#30324a;--line2:#3d4060;
  --fg:#eceaf6;--mute:#8f8ca8;--dim:#605e78;--gold:#ffc83d;--goldD:#9a6b00;--sel:#45c3ff;--snap:#ff4fd8;--ok:#5be38a;--bad:#ff5d73;--warn:#ffa64d;
  --fd:'Silkscreen',monospace;--fb:system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;
  --rail:52px;--top:48px;--side:300px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 var(--fb);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{user-select:text;-webkit-user-select:text}
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--side);grid-template-rows:var(--top) minmax(0,1fr);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.app.noside{grid-template-columns:var(--rail) minmax(0,1fr) 0}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);min-width:0}
.logo{font:700 15px/1 var(--fd);color:var(--gold);letter-spacing:.5px;white-space:nowrap;padding:0 6px 0 2px;text-shadow:2px 2px 0 #6a2a0c}
.logo b{color:var(--sel);text-shadow:2px 2px 0 #0d3a66;font-weight:700}
.scr{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;height:34px;padding:0 10px;cursor:pointer;min-width:0;max-width:220px}
.scr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.scr i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sp{flex:1}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;color:var(--fg);flex:none;position:relative}
.ib:hover{background:var(--panel2)}
.ib:active{background:var(--panel3)}
.ib.on{background:rgba(69,195,255,.16);border-color:rgba(69,195,255,.5);color:var(--sel)}
.ib:disabled{opacity:.3}
.ib svg{width:20px;height:20px}
.zoom{font:600 12px/1 var(--fb);color:var(--mute);min-width:44px;text-align:center;cursor:pointer;padding:6px 4px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.go{background:linear-gradient(#ffd45e,#f0b020);border-color:var(--goldD);color:#2a1800}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:17px;height:17px}
.saved{font-size:12px;color:var(--dim);white-space:nowrap}
/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto}
.rail .ib{width:40px;height:40px}
.rail hr{width:26px;border:0;border-top:1px solid var(--line);margin:4px 0}
.tip{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:8px;background:#000;color:#fff;font-size:12px;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
@media (hover:hover){.rail .ib:hover .tip{opacity:1}}
/* canvas */
.view{position:relative;overflow:hidden;background:#0b0c11;touch-action:none;min-width:0;min-height:0}
.view.grid-on{background-image:radial-gradient(circle,#1d1f2c 1px,transparent 1.2px);background-size:16px 16px}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px #2b2d40,0 10px 40px rgba(0,0,0,.6);background:#000;overflow:hidden}
#stage .bgimg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stage .gridov{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
.ly{position:absolute;transform-origin:50% 50%;pointer-events:none}
.ly>img,.ly>canvas{width:100%;height:100%;display:block;image-rendering:auto}
.ly.px>img,.ly.px>canvas{image-rendering:pixelated}
.ly.chg::after{content:'';position:absolute;inset:-1px;border:1.5px dashed var(--warn);border-radius:2px}
#refov{position:absolute;inset:0;pointer-events:none}
#refov img{width:100%;height:100%;display:block}
#over{position:absolute;inset:0;pointer-events:none;overflow:visible}
#over .h{pointer-events:auto;cursor:pointer}
.hud{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,10,16,.86);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font:600 12px/1.3 var(--fb);color:var(--fg);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmpbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(10,10,16,.9);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-size:12px}
.cmpbar input{flex:1;accent-color:var(--gold)}
/* side panel */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--panel);border-left:1px solid var(--line);min-width:0;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
.tab{flex:1;height:40px;border:0;background:none;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px}
.tab svg{width:16px;height:16px}
.tab.on{color:var(--fg);border-bottom-color:var(--gold)}
.pane{overflow-y:auto;overflow-x:hidden;padding:10px 12px 40px;min-height:0;user-select:none}
.sec{border-bottom:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.sec:first-child{padding-top:2px}
.sec:last-child{border-bottom:0}
.sh{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mute);text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.num{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:6px;height:32px;padding-left:8px;min-width:0}
.num:focus-within{border-color:var(--sel)}
.num b{font-size:11px;color:var(--dim);width:14px;flex:none}
.num input{width:100%;min-width:0;background:none;border:0;outline:0;height:100%;font-variant-numeric:tabular-nums;font-size:13px;padding:0 6px 0 2px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.fld input[type=text],.fld textarea,.fld select,.sel{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0;outline:0;color:var(--fg);font-size:13px}
.fld textarea{resize:vertical;min-height:56px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--sel)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rng{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.rng input{flex:1;accent-color:var(--gold);min-width:0}
.rng span{width:38px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.col{display:flex;align-items:center;gap:6px}
.col input[type=color]{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);padding:2px;flex:none}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border:0;border-radius:5px;background:none;cursor:pointer;color:var(--mute);display:grid;place-items:center;font-size:12px;font-weight:600}
.seg button.on{background:var(--panel3);color:var(--fg)}
.seg svg{width:16px;height:16px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}
.info{font-size:12px;color:var(--mute);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-wrap:anywhere}
.info code{color:#b9e6ff;font-size:11px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--panel3);color:var(--mute)}
.pill.w{background:rgba(255,166,77,.18);color:var(--warn)}
.pill.n{background:rgba(91,227,138,.15);color:var(--ok)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:24px 8px}
/* layers */
.lyr{display:flex;align-items:center;gap:6px;height:40px;padding:0 4px 0 6px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.lyr:hover{background:var(--panel2)}
.lyr.on{background:rgba(69,195,255,.13);border-color:rgba(69,195,255,.4)}
.lyr .th{width:34px;height:28px;flex:none;border-radius:4px;background:repeating-conic-gradient(#2a2b3a 0 25%,#222330 0 50%) 0 0/8px 8px;display:grid;place-items:center;overflow:hidden}
.lyr .th img,.lyr .th canvas{max-width:100%;max-height:100%}
.lyr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lyr .nm small{color:var(--dim);margin-left:4px}
.lyr .ib{width:28px;height:28px}
.lyr .ib svg{width:16px;height:16px}
.lyr.hid .nm,.lyr.hid .th{opacity:.4}
/* assets */
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats button{flex:none;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:12px;font-weight:600;color:var(--mute)}
.cats button.on{background:var(--gold);border-color:var(--goldD);color:#2a1800}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.ac{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:repeating-conic-gradient(#232433 0 25%,#1d1e2b 0 50%) 0 0/10px 10px;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;padding:4px}
.ac:active{border-color:var(--gold)}
.ac img{max-width:100%;max-height:100%;object-fit:contain}
.ac small{position:absolute;left:0;right:0;bottom:0;font-size:9px;background:rgba(0,0,0,.6);padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.ac.spr img{object-fit:cover;object-position:0 0;width:100%;height:100%}
/* sheets / dialogs / menus */
.scrim{position:fixed;inset:0;background:rgba(5,5,10,.6);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(820px,100%);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.dlg .body{overflow-y:auto;padding:14px 16px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sc{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg2);text-align:left;padding:0}
.sc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.sc img{display:block;width:100%;aspect-ratio:915/412;object-fit:cover}
.sc div{padding:6px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600}
.menu{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px;min-width:190px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;height:36px;border:0;background:none;padding:0 10px;border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.menu button:hover,.menu button:active{background:var(--panel3)}
.menu button svg{width:16px;height:16px;color:var(--mute)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu kbd{margin-left:auto;font:11px var(--fb);color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0a0a10;border:1px solid var(--gold);color:var(--fg);padding:9px 16px;border-radius:9px;opacity:0;transition:.18s;pointer-events:none;z-index:60;font-size:13px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.play{position:fixed;inset:0;background:#000;z-index:45;display:grid;place-items:center}
.play canvas{max-width:100vw;max-height:100vh}
.play .x{position:fixed;top:10px;right:10px}
.busy{position:fixed;inset:0;background:rgba(5,5,10,.75);z-index:70;display:grid;place-items:center}
.busy div{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:18px 22px;display:grid;gap:10px;min-width:240px;text-align:center}
.busy i{display:block;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}.busy i span{display:block;height:100%;width:0;background:var(--gold)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.help li{margin:4px 0}
/* narrow screens: panel becomes a bottom sheet */
@media (max-width:760px){
  .app,.app.noside{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) auto auto}
  .rail{grid-row:3;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px;overflow-x:auto}
  .rail hr{display:none}.tip{display:none}
  .side{grid-row:4;height:42vh;border-left:0;border-top:1px solid var(--line)}
  .app.noside .side{display:none}
  .hide-n{display:none!important}
}
@media (max-width:560px){.logo{display:none}.top{gap:2px;padding:0 4px}.scr{max-width:none;flex:1 1 auto;padding:0 8px}.ib{width:34px;height:34px}.zoom{min-width:38px}.btn.go{padding:0 10px}.sp{display:none}}
.rot-hint{position:absolute;left:10px;right:10px;top:10px;background:rgba(10,10,16,.88);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mute);display:none;pointer-events:none}
@media (orientation:portrait) and (max-width:760px){.rot-hint{display:block}}
@media (max-height:500px) and (min-width:761px){:root{--top:44px;--side:280px}.logo{font-size:13px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="logo">PIXELDECK <b>STUDIO</b></div>
    <button class="scr" id="scrBtn" title="เลือกหน้าจอเกม"><span id="scrName">—</span><i id="scrDirty" hidden></i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ib" id="undo" title="ย้อนกลับ (Ctrl+Z)"></button>
    <button class="ib" id="redo" title="ทำซ้ำ (Ctrl+Y)"></button>
    <span class="sp"></span>
    <span class="saved hide-n" id="saved"></span>
    <button class="ib hide-n" id="multi" title="เลือกหลายชิ้น"></button>
    <button class="ib" id="cmp" title="เทียบกับต้นฉบับ"></button>
    <span class="zoom" id="zoomLbl" title="พอดีจอ (0)">100%</span>
    <button class="ib" id="play" title="เล่นตัวอย่าง"></button>
    <button class="ib" id="sideBtn" title="แผงด้านข้าง"></button>
    <button class="btn go" id="sendBtn"><span id="sendIc"></span><span class="hide-n">ส่งให้ Claude</span></button>
  </div>
  <nav class="rail" id="rail"></nav>
  <div class="view" id="view">
    <div id="stage"><img class="bgimg" id="bgImg" alt=""><div id="layers"></div><div id="refov" hidden><img id="refImg" alt=""></div><div class="gridov" id="gridOv" hidden></div></div>
    <svg id="over"></svg>
    <div class="hud" id="hud" hidden></div>
    <div class="rot-hint">หมุนมือถือเป็นแนวนอนจะเห็นหน้าเกมใหญ่ขึ้น แก้ได้ถนัดกว่า</div>
    <div class="cmpbar" id="cmpBar" hidden><span>ต้นฉบับ</span><input type="range" id="cmpR" min="0" max="100" value="50"><span>ของใหม่</span><button class="btn sm" id="cmpX">ปิด</button></div>
  </div>
  <aside class="side" id="side">
    <div class="tabs"><button class="tab on" data-p="ins"></button><button class="tab" data-p="lay"></button><button class="tab" data-p="ast"></button></div>
    <div class="pane" id="pane"></div>
  </aside>
</div>
<input class="vh" type="file" id="fileImg" accept="image/*" multiple>
<input class="vh" type="file" id="fileZip" accept=".zip,application/zip">
<div class="toast" id="toast"></div>
<div class="busy" id="busy" hidden><div><b id="busyMsg">กำลังทำงาน</b><i><span id="busyBar"></span></i></div></div>
<script src="screens/data.js"></script>
<script src="game/manifest.js"></script>
<script src="jszip.min.js"></script>
<script>
'use strict';
/* ================= basics ================= */
const $=id=>document.getElementById(id),clamp=(v,a,b)=>v<a?a:v>b?b:v,D2R=Math.PI/180,R2D=180/Math.PI,tick=()=>new Promise(r=>setTimeout(r,0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function busy(m,f){const b=$('busy');if(m==null){b.hidden=true;return}b.hidden=false;$('busyMsg').textContent=m;$('busyBar').style.width=f==null?'0':Math.round(clamp(f,0,1)*100)+'%'}
const IC={
  sel:'<path d="M5 3l14 7-6.2 2L11 18.5z"/>',hand:'<path d="M8 12.5V5.8a1.5 1.5 0 013 0V11m0-1V4.6a1.5 1.5 0 013 0V11m0-.5V6.3a1.5 1.5 0 013 0v7.2a6.5 6.5 0 01-6.5 6.5h-.6a6.2 6.2 0 01-5.2-2.8l-2.4-4a1.5 1.5 0 012.5-1.6L8 12.5"/>',
  text:'<path d="M5 6.5V4.5h14v2M12 4.5v15M9 19.5h6"/>',rect:'<rect x="4" y="5" width="16" height="14" rx="3"/>',btn:'<rect x="3" y="7" width="18" height="10" rx="5"/><path d="M8 12h8"/>',
  img:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8.5 8.5"/>',spr:'<circle cx="12" cy="6" r="2.6"/><path d="M12 9v6m0 0l-3.5 5M12 15l3.5 5M7 11.5l5-1.5 5 1.5"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>',redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/>',
  play:'<path d="M7 4.5l12.5 7.5L7 19.5z" fill="currentColor" stroke="none"/>',multi:'<rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2"/>',

    if(L.grad){const g=x.createLinearGradient(0,y-L.size/2,0,y+L.size/2);g.addColorStop(0,L.color);g.addColorStop(1,L.color2||L.color);x.fillStyle=g}else x.fillStyle=L.color||'#fff';x.fillText(ln,tx,y)})}

  const cy=[[box.y0],[(box.y0+box.y1)/2],[box.y1]];for(const[v]of cy)for(const l of lines.ys){const d=l-v;if(Math.abs(d)<th&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,l}}

  if(c&&k.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}if(c&&k.toLowerCase()==='y'){ev.preventDefault();redo();return}
  if(c&&k.toLowerCase()==='c'){copySel();return}if(c&&k.toLowerCase()==='v'){pasteClip();return}if(c&&k.toLowerCase()==='d'){ev.preventDefault();duplicate();return}if(c&&k.toLowerCase()==='a'){ev.preventDefault();SEL=SC.layers.filter(l=>!l.hidden&&!l.locked).map(l=>l.id);renderSel();return}

  if(!c){if(k==='v')setTool('sel');if(k==='h')setTool('hand');if(k==='t')setTool('text');if(k==='r')setTool('box');if(k==='b')setTool('button');if(k==='0')fitView();if(k==='+'||k==='=')zoomAt(T.z*1.25,view.clientWidth/2,view.clientHeight/2);if(k==='-')zoomAt(T.z/1.25,view.clientWidth/2,view.clientHeight/2);if(k==="'")toggleGrid()}});

const near=(a,b)=>Math.abs(a-b)<.5;

function changeList(S){const out=[];const r=v=>Math.round(v);
  for(const L of S.layers){if(L.type==='cap'){if(!layerChanged(L))continue;const o=L.orig,ch=[];
      if(!near(L.x,o.x)||!near(L.y,o.y))ch.push(`ย้าย (${r(o.x)}, ${r(o.y)}) → (${r(L.x)}, ${r(L.y)})`);if(!near(L.w,o.w)||!near(L.h,o.h))ch.push(`ขนาด ${r(o.w)}×${r(o.h)} → ${r(L.w)}×${r(L.h)} (${Math.round(L.w/o.w*100)}%)`);
      if(L.rot)ch.push(`หมุน ${L.rot}°`);if(L.op!=null&&L.op<1)ch.push(`ความทึบ ${Math.round(L.op*100)}%`);if(L.fx)ch.push('กลับซ้าย-ขวา');if(L.fy)ch.push('กลับบน-ล่าง');if(L.hidden)ch.push('ซ่อน');if(L.srcOrig)ch.push(`เปลี่ยนรูปเป็น ${L.src.startsWith('idb:')?'รูปของฉัน':L.src.replace(/^game\//,'')}`);
      out.push({kind:'edit',id:L.id,name:L.name,desc:L.desc,orig:L.orig,now:{x:r(L.x),y:r(L.y),w:r(L.w),h:r(L.h),rot:L.rot||0,op:L.op==null?1:L.op},what:ch,note:L.note||''})}
    else out.push({kind:'new',id:L.id,type:L.type,name:L.name,now:{x:r(L.x),y:r(L.y),w:r(L.w),h:r(L.h),rot:L.rot||0},note:L.note||'',from:L.from||null})}
  for(const d of S.deleted||[])out.push({kind:'del',id:d.id,name:d.name,desc:d.desc,orig:d.orig});
  if(S.bgSrc)out.push({kind:'bg',src:S.bgSrc});if(S.bgHidden)out.push({kind:'bg',hidden:true});return out}

/* ================= render to PNG (play, export) ================= */
async function renderPNG(S,scale,t){const c=document.createElement('canvas');c.width=Math.round(S.w*scale);c.height=Math.round(S.h*scale);const x=c.getContext('2d');x.scale(scale,scale);x.imageSmoothingQuality='high';
  if(!S.bgHidden){const bg=await loadImg(S.bgSrc||S.bg);if(bg){if(S.bgSrc){const k=Math.max(S.w/bg.width,S.h/bg.height);x.drawImage(bg,(S.w-bg.width*k)/2,(S.h-bg.height*k)/2,bg.width*k,bg.height*k)}else x.drawImage(bg,0,0,S.w,S.h)}}else{x.fillStyle='#000';x.fillRect(0,0,S.w,S.h)}
  for(const L of S.layers){if(L.hidden)continue;x.save();x.globalAlpha=L.op==null?1:L.op;x.translate(L.x+L.w/2,L.y+L.h/2);x.rotate((L.rot||0)*D2R);x.scale(L.fx?-1:1,L.fy?-1:1);
    if(L.type==='cap'||L.type==='image'){const im=await loadImg(L.src);if(im){x.imageSmoothingEnabled=!L.px;x.drawImage(im,-L.w/2,-L.h/2,L.w,L.h)}}
    else if(L.type==='spr'||L.type==='fx'){const im=await loadImg(L.src);x.translate(-L.w/2,-L.h/2);drawSprite(x,L,L.w,L.h,im,t!=null?Math.floor(t*(L.fps||8)):(L.frame||0))}
    else{x.translate(-L.w/2,-L.h/2);if(L.type==='text')drawTextLayer(x,L,L.w,L.h);else if(L.type==='box')drawBox(x,L,L.w,L.h);else drawButton(x,L,L.w,L.h)}
    x.restore()}return c}
function playMode(){T.play=true;const d=document.createElement('div');d.className='play';d.innerHTML=`<canvas></canvas><button class="ib x" style="background:rgba(0,0,0,.5)">${svg('x')}</button>`;document.body.appendChild(d);const cv=d.querySelector('canvas');let run=true,busyR=false;
  const sz=()=>{const k=Math.min(innerWidth/SC.w,innerHeight/SC.h);cv.style.width=SC.w*k+'px';cv.style.height=SC.h*k+'px';return k};
  const loop=async ts=>{if(!run)return;if(!busyR){busyR=true;const k=sz(),c=await renderPNG(SC,Math.min(2,k*(devicePixelRatio||1)),ts/1000);cv.width=c.width;cv.height=c.height;cv.getContext('2d').drawImage(c,0,0);busyR=false}requestAnimationFrame(loop)};requestAnimationFrame(loop);
  d.onclick=()=>{run=false;T.play=false;d.remove();drawOver()}}

/* ================= files in ================= */
$('fileImg').onchange=async e=>{const fl=[...e.target.files];e.target.value='';if(!fl.length)return;busy('กำลังเพิ่มรูป …');let last=null;
  for(const f of fl){const key='u_'+uid();try{await idb.put(key,f)}catch(err){}URLS[key]=URL.createObjectURL(f);P.uploads.unshift({key,name:f.name.replace(/\.\w+$/,'')});last={key,name:f.name.replace(/\.\w+$/,'')}}
  busy(null);saveProject();if(ASEL){pickAsset('idb:'+last.key,last.name);return}if(fl.length===1)addImage('idb:'+last.key,last.name);else{T.acat='mine';setTab('ast');toast(`เพิ่ม ${fl.length} รูปในคลัง “รูปของฉัน”`)}};
$('fileZip').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{busy('กำลังเปิดงาน …');const z=await JSZip.loadAsync(f),lj=z.file(/(^|\/)layout\.json$/)[0];if(!lj)throw new Error('ไม่พบ layout.json');const L=JSON.parse(await lj.async('string'));
    for(const fe of z.file(/(^|\/)my_images\/.+/)){const key=fe.name.split('/').pop().replace(/\.\w+$/,'');const b=await fe.async('blob');await idb.put(key,b);URLS[key]=URL.createObjectURL(b);if(!P.uploads.some(u=>u.key===key))P.uploads.push({key,name:key})}
    for(const s of L.screens||[])if(SMAP[s.id])P.screens[s.id]={layers:s.layers,bgSrc:s.bgSrc||null,bgHidden:!!s.bgHidden,note:s.note||'',deleted:s.deleted||[],changes:(s.changes||[]).length};
    busy(null);await saveProject();openScreen(P.cur in SMAP?P.cur:(L.screens&&L.screens[0]&&L.screens[0].id)||'lobby');toast(`เปิดงานแล้ว ${(L.screens||[]).length} หน้า`)}catch(err){busy(null);toast('เปิดไฟล์ไม่ได้: '+(err.message||err))}};

/* ================= send to Claude ================= */
function screensChanged(){const ids=Object.keys(P.screens).filter(id=>SMAP[id]&&(P.screens[id].changes>0||(P.screens[id].note||'').trim()));return ids}
function sendDialog(){dirty(true);const ids=screensChanged();
  const d=dialog('ส่งให้ Claude',ids.length?`<p style="margin:0 0 10px;color:var(--mute)">เลือกหน้าที่จะส่ง แอปจะทำ ZIP ไฟล์เดียว มีภาพก่อน/หลัง รายการที่แก้เป็นภาษาไทย และตำแหน่งทุกชิ้น ให้ Claude เอาไปทำในเกมจริง</p>
    <div class="sgrid">${ids.map(id=>{const s=SMAP[id];return`<label class="sc on" style="cursor:pointer"><img src="screens/${id}/${s.ref}" alt=""><div><span><input type="checkbox" checked data-sid="${id}" style="accent-color:var(--gold)"> ${esc(s.name)}</span><span class="pill w">แก้ ${P.screens[id].changes}</span></div></label>`}).join('')}</div>
    <div class="fld" style="margin-top:12px">ข้อความถึง Claude (ไม่ใส่ก็ได้)<textarea id="sendMsg" placeholder="เช่น ทำตามนี้ในบิลด์ถัดไป"></textarea></div>`:'<div class="empty">ยังไม่ได้แก้หน้าไหนเลย ลองย้ายหรือเพิ่มชิ้นงานก่อน</div>',
    ids.length?`<button class="btn" data-x>ยกเลิก</button><button class="btn sm" id="sendPng">${svg('img')}แค่ภาพหน้านี้</button><button class="btn go" id="sendGo">${svg('zip')}สร้าง ZIP แล้วแชร์</button>`:'');
  const go=d.s.querySelector('#sendGo');if(go)go.onclick=async()=>{const sel=[...d.s.querySelectorAll('[data-sid]:checked')].map(x=>x.dataset.sid);const msg=(d.s.querySelector('#sendMsg')||{}).value||'';d.close();await exportZip(sel,msg)};
  const pn=d.s.querySelector('#sendPng');if(pn)pn.onclick=async()=>{d.close();busy('กำลังสร้างภาพ …');const c=await renderPNG(SC,2);busy(null);await saveFile(`pixeldeck_${SC.id}_layout.png`,await blobOf(c))}}
const blobOf=(c,t='image/png',q)=>new Promise(r=>c.toBlob(r,t,q));
function scrObj(id){const s=SMAP[id],e=P.screens[id];return{id,name:s.name,w:s.w,h:s.h,bg:`screens/${id}/${s.bg}`,ref:`screens/${id}/${s.ref}`,bgSrc:e.bgSrc,bgHidden:e.bgHidden,note:e.note||'',layers:e.layers,deleted:e.deleted||[]}}
function changeText(S){const c=changeList(S),L=[`== ${S.name} (${S.id}) ==`];if(S.note&&S.note.trim())L.push('โน้ตทั้งหน้า: '+S.note.trim());
  for(const x of c){if(x.kind==='edit')L.push(`• ${x.name}${x.desc&&x.desc.act?` [data-act=${x.desc.act}]`:''}: ${x.what.join(' · ')}${x.note?`\n    โน้ต: ${x.note}`:''}\n    selector: ${x.desc?x.desc.sel:''}`);
    else if(x.kind==='new')L.push(`+ เพิ่ม${TYPEN[x.type]||x.type} “${x.name}” ที่ (${x.now.x}, ${x.now.y}) ขนาด ${x.now.w}×${x.now.h}${x.now.rot?` หมุน ${x.now.rot}°`:''}${x.from&&x.from.desc?` (ก๊อปมาจาก ${x.from.screen}: ${x.from.desc.sel})`:''}${x.note?`\n    โน้ต: ${x.note}`:''}`);
    else if(x.kind==='del')L.push(`- ลบ ${x.name}${x.desc&&x.desc.act?` [data-act=${x.desc.act}]`:''}\n    selector: ${x.desc?x.desc.sel:''}`);
    else if(x.kind==='bg')L.push(x.hidden?'• ซ่อนพื้นหลัง':`• เปลี่ยนพื้นหลังเป็น ${x.src.startsWith('idb:')?'รูปของฉัน':x.src.replace(/^game\//,'')}`)}
  return L.join('\n')}
async function exportZip(ids,msg){if(!ids.length)return;busy('กำลังสร้าง ZIP …',0);try{
    const z=new JSZip(),out={app:'PixelDeck Studio',version:1,made:new Date().toISOString(),stage:'phone landscape 915×412 CSS px (#stage)',message:msg,screens:[]},txt=[`PixelDeck Studio — ส่งถึง Claude`,msg?`ข้อความ: ${msg}`:'',''];const used=new Set();
    for(let i=0;i<ids.length;i++){const S=scrObj(ids[i]);busy(`กำลังทำ ${S.name} …`,i/ids.length);await tick();
      const after=await renderPNG(S,2),before=await loadImg(S.ref);z.file(`${S.id}_after.png`,await blobOf(after));
      if(before){const cv2=document.createElement('canvas');cv2.width=S.w*2;cv2.height=S.h+40;const y=cv2.getContext('2d');y.fillStyle='#111';y.fillRect(0,0,cv2.width,cv2.height);y.drawImage(before,0,0,S.w,S.h);y.drawImage(after,S.w,0,S.w,S.h);
        y.fillStyle='#ffc83d';y.font='bold 20px sans-serif';y.fillText('ก่อน (เกมตอนนี้)',12,S.h+28);y.fillText('หลัง (ที่จัดใหม่)',S.w+12,S.h+28);z.file(`${S.id}_compare.jpg`,await blobOf(cv2,'image/jpeg',.88))}
      for(const L of S.layers)if(typeof L.src==='string'&&L.src.startsWith('idb:'))used.add(L.src.slice(4));if(S.bgSrc&&S.bgSrc.startsWith('idb:'))used.add(S.bgSrc.slice(4));
      out.screens.push({id:S.id,name:S.name,size:[S.w,S.h],note:S.note,bgSrc:S.bgSrc,bgHidden:S.bgHidden,changes:changeList(S),layers:S.layers.map(l=>({...l,frame:undefined})),deleted:S.deleted});txt.push(changeText(S),'')}
    for(const k of used){const b=await idb.get(k);if(b)z.file(`my_images/${k}.png`,b)}
    txt.push('ไฟล์: <id>_compare.jpg ก่อน/หลัง · <id>_after.png ภาพที่จัด · layout.json ตำแหน่งทุกชิ้น (หน่วย px ของ #stage 915×412) · my_images/ รูปที่เพิ่มเอง');
    z.file('layout.json',JSON.stringify(out,null,1));z.file('changes_th.txt',txt.join('\n'));
    const blob=await z.generateAsync({type:'blob'},m=>busy('กำลังบีบอัด …',m.percent/100));busy(null);
    const stamp=new Date(),nm=`pixeldeck_layout_${stamp.getFullYear()}${String(stamp.getMonth()+1).padStart(2,'0')}${String(stamp.getDate()).padStart(2,'0')}_${String(stamp.getHours()).padStart(2,'0')}${String(stamp.getMinutes()).padStart(2,'0')}.zip`;
    await saveFile(nm,blob,true)}catch(err){busy(null);toast('สร้าง ZIP ไม่สำเร็จ: '+(err.message||err))}}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function saveFile(name,blob,share){try{
    if(window.Android&&Android.begin){busy('กำลังบันทึก …');const id=Android.begin(name,blob.type||'application/octet-stream');if(!id)throw new Error('เปิดไฟล์ปลายทางไม่ได้');const u8=new Uint8Array(await blob.arrayBuffer()),CH=768*1024;
      for(let i=0;i<u8.length;i+=CH){if(!Android.chunk(id,b64(u8.subarray(i,i+CH))))throw new Error('เขียนไฟล์ไม่สำเร็จ');busy('กำลังบันทึก …',(i+CH)/u8.length);await tick()}const real=Android.end(id);busy(null);if(!real)throw new Error('ปิดไฟล์ไม่สำเร็จ');
      const d=dialog('บันทึกแล้ว',`<p style="margin:0">ไฟล์ <b>${esc(real)}</b> อยู่ในโฟลเดอร์ Download/PixelDeckForge</p><p style="margin:8px 0 0;color:var(--mute)">กด “แชร์” แล้วเลือกแอป Claude เพื่อส่งเข้าแชต</p>`,`<button class="btn" data-x>ปิด</button><button class="btn go" id="shr">${svg('send')}แชร์</button>`);
      d.s.querySelector('#shr').onclick=()=>{d.close();try{Android.share(id)}catch(e){}};return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('บันทึกแล้ว: '+name)}
  catch(e){busy(null);toast('บันทึกไม่สำเร็จ: '+(e.message||e))}}

/* ================= start ================= */
window.addEventListener('error',e=>{busy(null);toast('เกิดข้อผิดพลาด: '+(e.message||''))});
(async()=>{try{const p=await idb.get('project');if(p&&p.screens)P={...P,...p};for(const u of P.uploads)await ensureURL(u.key)}catch(e){}
  for(const id in P.screens){for(const L of P.screens[id].layers||[])if(typeof L.src==='string'&&L.src.startsWith('idb:'))await ensureURL(L.src.slice(4))}
  if(!SCREENS.length){document.body.innerHTML='<p style="padding:20px">ไม่พบข้อมูลหน้าจอเกม</p>';return}
  openScreen(ls.get('cur',P.cur)||'lobby');setTab('ins');railSync();T.tool='sel';railSync();if(SC.layers.some(l=>l.type==='spr'||l.type==='fx'))startAnim();
  if(!ls.get('helped',false)){ls.set('helped',true);setTimeout(help,400)}window.studioReady=true})();
</script>
