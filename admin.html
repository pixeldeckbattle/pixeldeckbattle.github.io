<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pixeldeck Admin</title>
<link rel="manifest" href="admin.webmanifest"><link rel="icon" href="admin-192.png"><link rel="apple-touch-icon" href="admin-192.png"><meta name="theme-color" content="#101425"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0d1226;--pn:#161d3c;--ln:#2c3768;--tx:#e9edff;--mu:#9aa6d6;--gd:#ffd84a;--gr:#5fe36a;--rd:#ff7a6b;--bl:#6fd8ff}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,"Noto Sans Thai","Loma",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#0a0e20;border-bottom:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center;gap:8px}
header b{font-size:17px;color:var(--gd)}header small{color:var(--mu);margin-left:auto;font-size:12px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 12px;position:sticky;top:44px;z-index:4;background:var(--bg)}
nav button{padding:9px 2px;border-radius:9px;border:1px solid var(--ln);background:var(--pn);color:var(--mu);font-weight:700;font-size:14px}
nav button.on{background:#2b3a8c;color:#fff;border-color:var(--gd)}
main{padding:4px 12px 60px;max-width:900px;margin:0 auto}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px;color:var(--gd)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kp div{background:#0f1530;border-radius:10px;padding:10px;text-align:center}.kp b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kp small{color:var(--mu)}
button,.btn{font:inherit;cursor:pointer}.b{padding:9px 14px;border-radius:9px;border:0;background:#3556d8;color:#fff;font-weight:700}.b.g{background:#1f8a3b}.b.r{background:#b3261e}.b.s{background:#2a3566}.b:disabled{opacity:.45}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--ln);background:#0f1530;color:var(--tx)}textarea{min-height:64px}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.fx{flex:none}
.sw{display:flex;align-items:center;gap:10px;justify-content:space-between}.tg{flex:none;width:58px;height:32px;border-radius:16px;border:0;background:#39406a;position:relative}.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:#1f8a3b}.tg.on i{left:29px}.tg.red.on{background:#b3261e}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}.mu{color:var(--mu)}.ok{color:var(--gr)}.er{color:var(--rd)}.gd{color:var(--gd)}.bl{color:var(--bl)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:700;background:#5a1d1d;color:#ffc9c2;margin:1px 2px 1px 0;white-space:nowrap}.chip.b2{background:#1d3a5a;color:#bfe6ff}.chip.g2{background:#4a3d0f;color:#ffe9a0}.o2{background:#5a2a0a;color:#ffc48a}
.fl{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.fl button{padding:5px 10px;border-radius:14px;border:1px solid var(--ln);background:#0f1530;color:var(--mu);font-size:13px}.fl button.on{background:#2b3a8c;color:#fff}
tr.pl{cursor:pointer}tr.pl:active{background:#202a58}.msg{margin:8px 0;font-weight:700}code{background:#0f1530;padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
#login{display:grid;place-content:center;justify-items:center;gap:14px;min-height:70vh;text-align:center;padding:20px}
a{color:var(--bl)}
body{font-size:16px}
nav{grid-template-columns:repeat(5,1fr)}nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;padding:7px 2px}nav button i{font-style:normal;font-size:20px;line-height:1.1}
.card h3{font-size:17px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:15px;margin:2px 0}
.pill.ok{background:#123d1f;color:#8dff98}.pill.wn{background:#4a3a08;color:#ffe27a}.pill.bad{background:#5a1d1d;color:#ffbdb3}.pill.ic{background:#123a5a;color:#a6e4ff}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st div{background:#0f1530;border-radius:10px;padding:10px 12px}.st small{display:block;color:var(--mu);font-size:13px}.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.al{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#0f1530;margin:6px 0;border-left:4px solid var(--rd)}.al .t{flex:1;min-width:0}.al .t b{display:block}.al .t small{display:block;color:var(--mu);font-size:13px}[data-op]{cursor:pointer}[data-op]:active{background:#202a58}
.note{color:var(--mu);font-size:13px;margin:8px 0 0}
details.sec{background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin:10px 0}
details.sec>summary{padding:13px 12px;font-weight:700;color:var(--gd);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▾';color:var(--mu)}details.sec[open]>summary::after{content:'▴'}
details.sec>.in{padding:0 12px 12px}.in>.card{margin:6px 0;padding:0;border:0!important;background:none}.in.h1>.card:first-child>h3:first-child{display:none}
.bars{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px;color:var(--mu);height:100%;min-width:0}.bars span{font-size:10.5px;color:var(--tx);white-space:nowrap}.bars i{display:block;width:100%;background:var(--gd);border-radius:4px 4px 0 0;min-height:2px}
</style></head><body>
<header><b>Pixeldeck Admin</b><small id="who"></small><button class="b s" id="out" style="padding:5px 10px;font-size:12px" hidden>ออก</button></header>
<div id="login"><h2 style="margin:0">หลังบ้าน Pixeldeck Battle</h2><p class="mu" style="margin:0">เข้าได้เฉพาะบัญชีเจ้าของเกม</p><button class="b" id="gin">ล็อกอินด้วย Google</button><p id="lmsg" class="er"></p></div>
<nav id="nav" hidden><button data-t="ov" class="on"><i>🏠</i>หน้าแรก</button><button data-t="ch"><i>🚨</i>จับโกง</button><button data-t="fi"><i>💰</i>เงิน</button><button data-t="pl"><i>👥</i>ผู้เล่น</button><button data-t="sw"><i>⚙️</i>ตั้งค่า</button></nav>
<main id="main" hidden></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* Pixeldeck Battle - owner's admin page. This page is public; it has no power of its own. Every read and write below is allowed or refused
   by the Firestore rules, which let only the owner's Google account see other players' saves, the slip ledger and adminlog, and write config/main. */
const FB_CFG={"apiKey": "AIzaSyBxPtaSzWfEWeLUZffrgB5cbr1Mhtdpj7M", "authDomain": "pixeldeck-battle-1a625.firebaseapp.com", "projectId": "pixeldeck-battle-1a625", "storageBucket": "pixeldeck-battle-1a625.firebasestorage.app", "messagingSenderId": "520020450750", "appId": "1:520020450750:web:c54dadd6f487038ab22def", "databaseURL": "https://pixeldeck-battle-1a625-default-rtdb.asia-southeast1.firebasedatabase.app"},CARDS={"h06": ["Bone Raider", "ST"], "h20": ["Goblin Scrapper", "ST"], "h11": ["Stone Golem", "ST"], "h17": ["Goblin Berserker", "C"], "h12": ["Vampire Bat", "C"], "h01": ["Magma Golem", "C"], "h02": ["Leaf Ronin", "UC"], "h16": ["Elder Treant", "UC"], "h21": ["Sylvan Archer", "UC"], "h05": ["Soul Reaper", "R"], "h09": ["Lion Paladin", "R"], "h10": ["Frost Fenrir", "R"], "h08": ["Shadow Ninja", "R"], "h15": ["Glacier Sage", "L"], "h13": ["Crimson Lord", "L"], "h14": ["Scarlet Griffin", "L"], "h19": ["Inferno Drake", "L"], "h04": ["Frost Empress", "L"], "h03": ["Zeus", "SL"], "h22": ["Wukong", "SL"], "h07": ["Seraphina", "SL"], "h18": ["Aurum Hydra", "LT"], "h23": ["Ember Witch", "C"], "h24": ["Storm Shaman", "UC"], "h25": ["Ironbark Guardian", "UC"], "h26": ["Obsidian Colossus", "L"], "h27": ["Aegis Valkyrie", "SL"], "h28": ["Glacius Rex", "LT"], "h29": ["Vanarin", "SL"], "h30": ["Tenface Asura", "SL"], "h31": ["Indigo Dragonsteed", "SL"], "h34": ["Temple Yaksha", "L"], "h39": ["Lotus Herbalist", "R"], "h40": ["Brass Gunner", "R"]},AMS={"tiger": ["เขี้ยวเสือ", "R"], "turtle": ["กระดองเต่า", "R"], "hawk": ["ตาเหยี่ยว", "R"], "rock": ["หินผา", "R"], "dagger": ["มีดนักฆ่า", "R"], "dragon": ["หัวใจมังกร", "L"], "ruby": ["ทับทิมโลหิต", "L"], "feather": ["ขนนกเทวา", "L"], "kfang": ["เขี้ยวราชันย์", "SL"], "dscale": ["เกราะมังกรเทพ", "SL"], "deye": ["เนตรมรณะ", "SL"], "seraph": ["ปีกเซราฟ", "SL"], "grove": ["มรกตพฤกษา", "SL"], "lion": ["หัวใจราชสีห์", "SL"], "hourglass": ["นาฬิกาทรายสะท้อน", "SL"], "phoenix": ["ขนนกฟีนิกซ์", "SL"], "compass": ["เข็มทิศพายุ", "SL"], "gstar": ["ดาราพิทักษ์", "SL"], "rabbit": ["เครื่องรางกระต่ายจันทร์", "L"], "hunter": ["ตาพราน", "L"], "pearl": ["ไข่มุกห้วงลึก", "L"], "hallow": ["โคมวิญญาณฟักทอง", "LT"], "clover": ["Lucky Clover", "LT"]},BUILD='b265';
firebase.initializeApp(FB_CFG);const db=firebase.firestore(),FV=firebase.firestore.FieldValue,$=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>(+v||0).toLocaleString('en'),ms=v=>!v?0:v.toMillis?v.toMillis():+v||Date.parse(v)||0;
const dt=v=>{const m=ms(v);return m?new Date(m).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-'};
const ago=v=>{const m=Date.now()-ms(v);if(!ms(v))return '-';const mi=Math.floor(m/6e4);return mi<1?'เมื่อกี้':mi<60?mi+' นาที':mi<1440?Math.floor(mi/60)+' ชม.':Math.floor(mi/1440)+' วัน'};
const dayStart=(back=0)=>{const d=new Date(Date.now()+7*36e5);d.setUTCHours(0,0,0,0);return new Date(d.getTime()-7*36e5-back*864e5)};
const cnt=q=>typeof q.count==='function'?q.count().get().then(r=>r.data().count):q.get().then(r=>r.size);
let me=null,tab='ov',cfg={},slips=null,alog=null,players=null,pf={q:'',f:'all',s:'seen'},sel=null,busy=false;
const say=(t,cls='ok')=>{const m=$('msg');if(m){m.className='msg '+cls;m.textContent=t}};
const fail=e=>say('ไม่สำเร็จ: '+(e&&(e.code||e.message)||e),'er');

$('gin').onclick=()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$('lmsg').textContent='ล็อกอินไม่สำเร็จ: '+(e.code||e.message)});
$('out').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(u=>{me=u;$('who').textContent=u?u.email:'';$('out').hidden=!u;
  if(!u){$('login').hidden=false;$('nav').hidden=$('main').hidden=true;return}
  // the only real check is the rules: an account that is not the owner cannot read adminlog
  db.collection('adminlog').limit(1).get().then(()=>{$('login').hidden=true;$('nav').hidden=$('main').hidden=false;go('ov')})
   .catch(e=>{$('lmsg').textContent=e.code==='permission-denied'?'บัญชี '+u.email+' ไม่มีสิทธิ์เข้าหลังบ้าน (หรือยังไม่ได้วางกฎ Firestore ชุดใหม่)':'เชื่อมต่อไม่ได้: '+(e.code||e.message)})});
$('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)};
function go(t){tab=t;sel=null;[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('main').onclick=null;scrollTo(0,0);({ov,ch,sw,fi,pl})[t]()}
// one listener for every page: [data-go] switches tab, a player row ([data-op] or tr.pl) opens that player's page
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&$('main').contains(g)){e.stopPropagation();return go(g.dataset.go)}
  const o=e.target.closest('[data-op],tr.pl[data-id]');if(o&&$('main').contains(o)){e.stopPropagation();openP(o.dataset.op||o.dataset.id)}},true);
const LD='<div class="card"><p class="mu" style="margin:0">กำลังโหลด…</p></div>',ER=e=>put('<div class="card"><p class="er" style="margin:0">โหลดไม่ได้: '+esc(e&&(e.code||e.message)||e)+'</p></div>');
const sec=(t,h,open)=>`<details class="sec"${open?' open':''}><summary>${t}</summary><div class="in h1">${h}</div></details>`;
const agoT=v=>{const a=ago(v);return a==='-'||a==='เมื่อกี้'?a:a+'ก่อน'};
const put=h=>{$('main').innerHTML=h};
const loadCfg=()=>db.collection('config').doc('main').get().then(d=>{cfg=d.exists?d.data()||{}:{};return cfg});
const loadSlips=()=>db.collection('slips').orderBy('at','desc').limit(500).get().then(q=>slips=q.docs.map(d=>({id:d.id,...d.data()})));
const loadLog=()=>db.collection('adminlog').orderBy('at','desc').limit(300).get().then(q=>alog=q.docs.map(d=>({id:d.id,...d.data()})));
const logIt=o=>db.collection('adminlog').add({...o,by:me.email,at:FV.serverTimestamp()}).catch(()=>{});

/* ---------- overview ---------- */
let FX={};const loadFx=()=>db.collection('flags').get().then(q=>{FX={};q.docs.forEach(d=>FX[d.id]=d.data());return FX}).catch(()=>FX);
const slipSum=from=>slips.filter(s=>ms(s.at)>=from).reduce((a,s)=>[a[0]+(+s.thb||0),a[1]+1],[0,0]);
// flags written by the game itself (auto-freeze), newest first, banned accounts last
const fxList=()=>{const b=cfg.bans||{};return Object.keys(FX).map(id=>[id,FX[id]]).sort((x,y)=>(!!b[x[0]]-!!b[y[0]])||ms(y[1].at)-ms(x[1].at))};
const nameOf=id=>(FX[id]&&FX[id].n)||((players||[]).find(p=>p.id===id)||PC[id]||{}).name||id.slice(0,10)+'…';
const alRow=(id,f)=>`<div class="al" data-op="${esc(id)}"><div class="t"><b>${esc(f.n||nameOf(id))}${(cfg.bans||{})[id]?' <span class="chip">ระงับแล้ว</span>':''}</b><small>${esc(FXW[f.why]||f.why||'?')}${f.amt?' · +'+N(f.amt):''} · ${agoT(f.at)}</small></div><span class="mu">›</span></div>`;
function bars7(){const d=[];for(let i=6;i>=0;i--){const f=dayStart(i).getTime(),t=dayStart(i-1).getTime();d.push([new Date(f+7*36e5).getUTCDate(),slips.filter(s=>{const m=ms(s.at);return m>=f&&m<t}).reduce((a,s)=>a+(+s.thb||0),0)])}
  const mx=Math.max(1,...d.map(x=>x[1]));return `<div class="bars">${d.map(([day,v],i)=>`<div><span>${v?N(v):''}</span><i style="height:${Math.round(v/mx*62)}px${i===6?';background:var(--gr)':''}"></i>${i===6?'วันนี้':day}</div>`).join('')}</div>`}

/* ---------- home ---------- */
function ov(){put(LD);
  const on=cnt(db.collection('online').where('at','>',new Date(Date.now()-15*6e4))),all=cnt(db.collection('saves')),td=cnt(db.collection('saves').where('at','>=',dayStart())),wk=cnt(db.collection('saves').where('at','>=',dayStart(6)));
  Promise.all([on,all,td,wk,loadSlips(),loadCfg(),loadFx(),db.collection('grants').get()]).then(([on,all,td,wk,,,,g])=>{if(tab!=='ov')return;
    const a=slipSum(dayStart().getTime()),b=slipSum(dayStart(6).getTime()),c=slipSum(dayStart(29).getTime()),fx=fxList(),nb=Object.keys(cfg.bans||{}).length,nw=fx.filter(([id])=>!(cfg.bans||{})[id]).length;
    put(`<div class="card">${cfg.maint?'<span class="pill bad">🔧 ปิดปรับปรุงอยู่ ผู้เล่นเข้าไม่ได้</span>':'<span class="pill ok">🟢 เกมเปิดปกติ</span>'} ${(cfg.pay||{}).on===false?'<span class="pill wn">💎 ปิดรับเติมเพชร</span>':''}${cfg.notice?`<p class="note">📢 ประกาศที่ขึ้นอยู่: ${esc(cfg.notice)}</p>`:''}</div>
    <div class="card"${nw?' style="border-color:var(--rd)"':''}><h3>🚨 จับคนโกง</h3>${nw?`<p style="margin:0 0 4px"><b class="er" style="font-size:19px">${nw} คน</b> ถูกระบบจับ รอคุณตรวจ</p>`:'<p style="margin:0 0 4px"><span class="pill ok">✅ ไม่มีใครถูกจับใหม่</span></p>'}
     ${fx.slice(0,3).map(([id,f])=>alRow(id,f)).join('')}<button class="b${nw?'':' s'}" data-go="ch" style="margin-top:6px;width:100%">ไปหน้าจับโกง →</button><p class="note">ระงับอยู่ ${N(nb)} บัญชี · เกมแช่แข็งคนที่ Gold/เพชร/การ์ดเพิ่มผิดปกติให้เอง แตะชื่อเพื่อตรวจ</p></div>
    <div class="card"><h3>💰 เงินเข้า</h3><div class="st"><div><small>วันนี้</small><b class="gd">฿${N(a[0])}</b><small>${N(a[1])} สลิป</small></div><div><small>7 วัน</small><b class="gd">฿${N(b[0])}</b><small>${N(b[1])} สลิป</small></div></div>${bars7()}
     <p class="note">30 วัน ฿${N(c[0])}${g.size?` · <b class="gd">เพชรรอผู้เล่นมารับ ${g.size} รายการ</b>`:''}</p><button class="b s" data-go="fi" style="margin-top:8px;width:100%">ดูรายการเงิน →</button></div>
    <div class="card"><h3>👥 คนเล่น</h3><div class="st"><div><small>ออนไลน์ตอนนี้</small><b class="ok">${N(on)}</b></div><div><small>เข้าเล่นวันนี้</small><b>${N(td)}</b></div><div><small>เข้าเล่น 7 วัน</small><b>${N(wk)}</b></div><div><small>บัญชีทั้งหมด</small><b>${N(all)}</b></div></div></div>
    <details class="sec"><summary>🔗 ทางลัด</summary><div class="in"><p style="margin:0;line-height:2.2"><a href="https://console.firebase.google.com/project/${esc(FB_CFG.projectId)}/firestore/usage" target="_blank" rel="noopener">โควตาฐานข้อมูล (Firebase)</a><br><a href="https://developer.thunder.in.th" target="_blank" rel="noopener">โควตาตรวจสลิป (Thunder)</a><br><a href="https://dash.cloudflare.com" target="_blank" rel="noopener">Worker เติมเพชร (Cloudflare)</a><br><a href="./" target="_blank" rel="noopener">เปิดเกม</a></p><p class="note">Admin ${esc(BUILD)} · เปิดหน้านี้ใช้การอ่านฐานข้อมูลประมาณ ${N(slips.length+Object.keys(FX).length+g.size+6)} ครั้ง</p></div></details>`)}).catch(ER)}

/* ---------- cheaters ---------- */
function ch(){put(LD);Promise.all([loadCfg(),loadFx()]).then(()=>{if(tab==='ch')chDraw()}).catch(ER)}
function chDraw(){const fx=fxList(),bans=cfg.bans||{},bl=Object.keys(bans);

  if($('wipeone'))$('wipeone').onclick=()=>{if($('wpn').value.trim()!==p.name)return say('พิมพ์ชื่อไม่ตรง','er');if(!confirm('ล้างเซฟ '+p.name+' ทั้งหมด? ย้อนกลับไม่ได้'))return;
    const ns={gold:0,dia:0,cleared:0,cards:{},team:[],auto:false,era:Math.max(p.era2||1,+cfg.era||1),me:{name:p.name},rv:(p.rv||0)+1000000,ts:Date.now(),wiped:Date.now()};
    db.collection('saves').doc(id).set({data:JSON.stringify(ns),ts:ns.ts,rv:ns.rv,name:p.name,cleared:0,at:FV.serverTimestamp()}).then(()=>db.collection('flags').doc(id).delete().catch(()=>{})).then(()=>{logIt({t:'wipe1',to:id,note:p.name});delete PC[id];delete FX[id];if(players)players=players.filter(x=>x.id!==id);openP(id);setTimeout(()=>say('ล้างเซฟแล้ว'),800)}).catch(e=>{if(e&&e.code==='permission-denied')say('ยังล้างไม่ได้: ต้องวางกฎ Firestore ชุดใหม่ (b259) ก่อน','er');else fail(e)})};
  if($('ban'))$('ban').onclick=()=>{const r=$('breason').value.trim()||'ผิดกติกา';if(!confirm('ระงับบัญชี '+p.name+' ?\nเหตุผล: '+r))return;db.collection('config').doc('main').set({bans:{[id]:r}},{merge:true}).then(()=>{logIt({t:'ban',to:id,note:r});return loadCfg()}).then(()=>{plOne(id);say('ระงับแล้ว มีผลภายในประมาณ 10 นาที')}).catch(fail)};
  if($('unban'))$('unban').onclick=()=>{if(!confirm('ปลดระงับ '+p.name+' ?'))return;db.collection('config').doc('main').update({['bans.'+id]:FV.delete()}).then(()=>{logIt({t:'unban',to:id});return loadCfg()}).then(()=>{plOne(id);say('ปลดระงับแล้ว')}).catch(fail)}}
</script></body></html>
